events {
    worker_connections 1024;

}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream for API
    upstream blog-api {
        server api:8080;
    }

    server {
        listen 80;
        server_name localhost;
        
        
        # API proxy
        location /api/ {
            proxy_pass http://blog-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # CORS headers for API
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            
            # Handle preflight requests
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                return 204;
            }
        }
        
        # Auth endpoints proxy - specific routes only
        location /auth/google {
            proxy_pass http://blog-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /auth/google/callback {
            proxy_pass http://blog-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Login endpoint proxy
        location /login {
            proxy_pass http://blog-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health check proxy
        location /health {
            proxy_pass http://blog-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Admin endpoints proxy
        location /admin/ {
            proxy_pass http://blog-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Static files root
        root /usr/share/nginx/html;
        index index.html;
        
        # Serve original files with proper Content-Type
        location ~* \.js$ {
            add_header Content-Type "application/javascript";
            add_header Vary "Accept-Encoding";
        }
        
        location ~* \.css$ {
            add_header Content-Type "text/css";
            add_header Vary "Accept-Encoding";
        }
        
        location ~* \.html$ {
            add_header Content-Type "text/html";
            add_header Vary "Accept-Encoding";
            add_header Cross-Origin-Opener-Policy "unsafe-none";
        }
        
        # Cache headers for static assets
        location ~* \.(js|css|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(json|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            expires 1d;
            add_header Cache-Control "public";
        }
        
        # Handle SPA routing - serve index.html for all routes
        location / {
            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy "strict-origin-when-cross-origin";
            add_header Cross-Origin-Opener-Policy "unsafe-none";
            
            try_files $uri $uri/ /index.html;
        }
    }
}
