apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-config
  namespace: blog
data:
  COSMOS_DB_ENDPOINT: "https://cosmos-blog-brxstng-prod.documents.azure.com:443/"
  COSMOS_DB_DATABASE_NAME: "blog"
  FRONTEND_URL: "https://brxstrng.com"
  GOOGLE_REDIRECT_URL: "https://api.brxstrng.com/auth/google/callback"
  REDIS_ADDR: "blog-customredis:6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_SERVICE_NAME: "blog-api"
  OTEL_DEPLOYMENT_ENVIRONMENT: "production"
