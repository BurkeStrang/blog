apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-ui
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: blog-ui
    spec:
      nodeSelector:
        workload: ui
      containers:
        - name: blog-ui
          image: acrblogbrxstngprod.azurecr.io/blog-ui:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
