apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog
  namespace: blog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - brxstrng.com
        - www.brxstrng.com
      secretName: blog-ui-tls
    - hosts:
        - api.brxstrng.com
      secretName: blog-api-tls
  rules:
    - host: brxstrng.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-ui
                port:
                  number: 80
    - host: www.brxstrng.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-ui
                port:
                  number: 80
    - host: api.brxstrng.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-api
                port:
                  number: 80
