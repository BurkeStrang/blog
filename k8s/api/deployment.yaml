apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      nodeSelector:
        workload: api
      containers:
        - name: blog-api
          image: acrblogbrxstngprod.azurecr.io/blog-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: COSMOS_DB_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: COSMOS_DB_ENDPOINT
            - name: COSMOS_DB_DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: COSMOS_DB_DATABASE_NAME
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: FRONTEND_URL
            - name: GOOGLE_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: GOOGLE_REDIRECT_URL
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: REDIS_ADDR
            - name: COSMOS_DB_KEY
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: COSMOS_DB_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
