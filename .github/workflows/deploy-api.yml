name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - "api-dotnet/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-blog-prod
  CONTAINERAPP_NAME: ca-blog-api-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve ACR and login
        run: |
          ACR_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          echo "ACR_SERVER=$ACR_SERVER" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          az acr login --name "${ACR_SERVER%%.*}"

      - name: Build and push API image
        run: |
          docker build \
            -t "$ACR_SERVER/blog-api:$IMAGE_TAG" \
            -t "$ACR_SERVER/blog-api:latest" \
            api/
          docker push "$ACR_SERVER/blog-api:$IMAGE_TAG"
          docker push "$ACR_SERVER/blog-api:latest"

      - name: Roll out to Container App
        run: |
          az containerapp update \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/blog-api:$IMAGE_TAG" \
            --query "properties.latestRevisionName" \
            -o tsv
